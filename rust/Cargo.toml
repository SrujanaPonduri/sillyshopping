[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
memchr = "2"
memmap2 = "0.9"
rayon = "1"
ahash = "0.8"
serde_json = "1"
arrow = { version = "56", default-features = false, features = ["prettyprint"] }
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
